name: mold
description: >-
  Pack an existing project into a portable template archive and unpack it with
  manifest-driven renaming. Ships its own `mold` CLI (`pack` / `unpack`) and is
  consumable as a library.
version: 0.1.4
repository: https://github.com/pro100andrey/mold
issue_tracker: https://github.com/pro100andrey/mold/issues

topics:
  - scaffolding
  - template
  - cli
  - boilerplate
  - project-generator

environment:
  sdk: ^3.13.5

executables:
  mold:

dependencies:
  archive: ^4.5.2
  args: ^2.7.0
  glob: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.33.0
